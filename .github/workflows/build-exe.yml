name: Publish WanXiangPOS Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wanxiangpos-main-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './money-pos-web/package-lock.json'

      - name: Prepare next patch version
        id: release_version
        working-directory: ./money-pos-web
        shell: powershell
        run: |
          $current = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          if ($current -notmatch '^\d+\.\d+\.\d+$') {
            throw "Automatic main releases require a stable SemVer version (for example 1.0.12); received: $current"
          }
          $parts = $current.Split('.')
          $next = "{0}.{1}.{2}" -f $parts[0], $parts[1], ([int]$parts[2] + 1)
          npm version $next --no-git-tag-version --ignore-scripts
          "value=$next" >> $env:GITHUB_OUTPUT

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend (Maven)
        working-directory: ./money-pos
        # PowerShell splits an unquoted dotted version (for example 1.0.12) into a separate token.
        # Keep the Maven revision property as one argument so `.0.12` is never treated as a lifecycle phase.
        run: mvn clean package -DskipTests "-Drevision=${{ steps.release_version.outputs.value }}"

      - name: Build Frontend (Vue)
        working-directory: ./money-pos-web
        run: |
          npm ci
          npm run release:check
          npm run build

      - name: Prepare External Environments (JRE & MariaDB)
        shell: powershell
        run: |
          mkdir build-env
          cd build-env
          
          # --- 下载并处理 JRE ---
          echo "Downloading JRE 17..."
          $jreUrl = "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.10%2B7/OpenJDK17U-jre_x64_windows_hotspot_17.0.10_7.zip"
          Invoke-WebRequest -Uri $jreUrl -OutFile "jre.zip"
          Expand-Archive -Path "jre.zip" -DestinationPath "."
          Get-ChildItem -Path "jdk*" | Rename-Item -NewName "jre"
          Remove-Item "jre.zip"
          
          # 🌟 品牌重塑：自动给 Java 引擎改名 Vana
          echo "Renaming java.exe to vana-java.exe..."
          Rename-Item -Path "jre\bin\java.exe" -NewName "vana-java.exe" -Force
          Rename-Item -Path "jre\bin\javaw.exe" -NewName "vana-javaw.exe" -Force -ErrorAction SilentlyContinue
          
          # --- 下载并处理 MariaDB ---
          echo "Downloading MariaDB 10.11..."
          $dbUrl = "https://archive.mariadb.org/mariadb-10.11.6/winx64-packages/mariadb-10.11.6-winx64.zip"
          Invoke-WebRequest -Uri $dbUrl -OutFile "mariadb.zip"
          Expand-Archive -Path "mariadb.zip" -DestinationPath "."
          Get-ChildItem -Path "mariadb-10*" | Rename-Item -NewName "mariadb"
          Remove-Item "mariadb.zip"
          
          # 极致瘦身
          Remove-Item -Recurse -Force "mariadb/mysql-test" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "mariadb/sql-bench" -ErrorAction SilentlyContinue

      - name: Assemble All Resources
        shell: powershell
        run: |
          echo "Copying backend JAR..."
          New-Item -ItemType Directory -Force -Path "money-pos-web/backend"
          # 🌟 品牌重塑：复制过来的后端包直接改名为 vana-pos.jar
          Copy-Item -Path "money-pos/qk-money-app/money-app-biz/target/*.jar" -Destination "money-pos-web/backend/vana-pos.jar" -Force
          
          echo "Moving JRE and MariaDB..."
          Move-Item -Path "build-env/jre" -Destination "money-pos-web/jre" -Force
          Move-Item -Path "build-env/mariadb" -Destination "money-pos-web/mariadb" -Force

      - name: Build Electron EXE
        working-directory: ./money-pos-web
        run: |
          npm run electron:build

      - name: Prepare release asset
        id: release_asset
        shell: powershell
        run: |
          $version = "${{ steps.release_version.outputs.value }}"
          $installer = Get-ChildItem -Path "money-pos-web/release" -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            throw "Electron installer was not produced"
          }
          New-Item -ItemType Directory -Force -Path "release-artifact" | Out-Null
          $assetName = "WanXiangPOS-Setup-v$version.exe"
          Copy-Item -Path $installer.FullName -Destination "release-artifact/$assetName" -Force
          "path=release-artifact/$assetName" >> $env:GITHUB_OUTPUT

      - name: Commit version and create release tag
        shell: powershell
        run: |
          $version = "${{ steps.release_version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add money-pos-web/package.json money-pos-web/package-lock.json
          git commit -m "chore(release): v$version"
          git push origin HEAD:main
          git tag "v$version"
          git push origin "v$version"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.value }}
          generate_release_notes: true
          files: ${{ steps.release_asset.outputs.path }}
          fail_on_unmatched_files: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WanXiangPOS-Installer-v${{ steps.release_version.outputs.value }}
          path: ${{ steps.release_asset.outputs.path }}
